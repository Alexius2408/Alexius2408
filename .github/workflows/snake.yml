name: Generate Contribution Snake

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
              dist/github-contribution-grid-snake.svg?color_snake=%23fed7aa&color_dots=%233642,%237c2d12,%23ea580c,%23ff900d,%23ffb00d
              dist/github-contribution-grid-snake-dark.svg?palette=forgejo-dark&color_snake=%23fed7aa&color_dots=%233642,%237c2d12,%23ea580c,%23ff900d,%23ffb00d

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
