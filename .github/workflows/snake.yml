name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%236d28d9&color_dots=%23ede9fe,%23c4b5fd,%23a78bfa,%238b5cf6,%236d28d9
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23a855f7&color_dots=%230d1117,%234c1d95,%236d28d9,%238b5cf6,%23c4b5fd

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
