name: Update Discord Status

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Generate status
        env:
          DISCORD_ID: ${{ secrets.DISCORD_ID }}
        run: node ./status.js

      - name: Check generated files
        run: |
          echo "Generated files:"
          ls -la generated

      - name: Commit changes
        run: |
          git config user.name ${{ secrets.GITHUBNAME }}
          git config user.email ${{ secrets.GITHUBNOREPLYEMAIL }}

          git add generated/status-online.svg generated/status-listening.svg README.md

          if git diff --cached --quiet; then
            echo "No status changes."
          else
            git commit -m "Automatic: Update Discord status"
            git push origin main
          fi