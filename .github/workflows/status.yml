name: Update Discord Status

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check status script
        run: |
          echo "Current directory:"
          pwd

          echo "Repository files:"
          ls -la

          echo "Checking status.js:"
          test -f status.js
          echo "status.js found!"

      - name: Generate status
        env:
          DISCORD_ID: ${{ secrets.DISCORD_ID }}
        run: node ./status.js

      - name: Check generated files
        run: |
          echo "Generated files:"
          ls -la generated

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add generated/status-online.svg generated/status-listening.svg

          if git diff --cached --quiet; then
            echo "No status changes."
          else
            git commit -m "Update Discord status"
            git push origin main
          fi